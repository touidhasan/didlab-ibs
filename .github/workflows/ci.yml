name: ci
on: [push, pull_request]
jobs:
  testbed-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install testbed
        working-directory: testbed
        run: npm ci
      - name: Quick simulation (R4 vs incident replay)
        working-directory: testbed
        run: npm run sim:quick
      - name: rpc backend against an interval-mined local node
        working-directory: testbed
        run: |
          (MINING_INTERVAL=250 npx hardhat --config hardhat.rpc-test.config.js node --port 8598 > /tmp/hhrpc.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8598 && break; sleep 1; done
          BACKEND=rpc RPC=http://127.0.0.1:8598 HORIZON=40 node sim.mjs =R4-A1
      - name: rpc backend survives null state reads (limitation E13)
        working-directory: testbed
        run: |
          (node tools/nullproxy.mjs 8597 http://127.0.0.1:8598 7 > /tmp/nullproxy.log 2>&1 &)
          sleep 1
          BACKEND=rpc RPC=http://127.0.0.1:8597 HORIZON=40 TRACE=1 OUT=/tmp/nulls.json node sim.mjs =R4-A1
          node -e 'const r=require("/tmp/nulls.json").results[0]; const s=r.timing.rpc; console.log(s); if(!(s.nullReads>0 && s.recovered===s.nullReads)) process.exit(1)'
      - name: A3r replaces stalled nonces on an interval-mined node (limitation E8)
        working-directory: testbed
        run: |
          BACKEND=rpc RPC=http://127.0.0.1:8598 HORIZON=40 OUT=/tmp/a3r.json node sim.mjs =R0-A3r
          node -e 'const r=require("/tmp/a3r.json").results[0]; console.log(r.attackerOps); if(!(r.attackerOps.replacements>0)) process.exit(1)'
      - name: A3r and A9 equal A3 when the client refuses underfunded transactions (Hardhat in-process)
        working-directory: testbed
        run: |
          for s in R0-A3 R0-A3r R0-A9; do HORIZON=60 OUT=/tmp/$s.json node sim.mjs =$s; done
          node -e '
            const [a, r, q] = ["R0-A3", "R0-A3r", "R0-A9"].map(s => require(`/tmp/${s}.json`).results[0]);
            const same = x => ["lossUsd", "benign", "signerDenials"].every(k => JSON.stringify(x[k]) === JSON.stringify(a[k]));
            console.log(a.lossUsd, r.lossUsd, q.lossUsd, r.attackerOps, q.attackerOps);
            if (!same(r) || !same(q) || r.attackerOps.replacements !== 0 || q.attackerOps.prequeueRejected !== 3) process.exit(1)'
      - name: A5 (blind signing at a multisig) and A8 (drip below the budgets)
        working-directory: testbed
        run: |
          for s in R0-A5 R4-A5 R1-A8; do HORIZON=40 OUT=/tmp/$s.json node sim.mjs =$s; done
          node -e '
            const [d, f, p] = ["R0-A5", "R4-A5", "R1-A8"].map(s => require(`/tmp/${s}.json`).results[0]);
            console.log(d.attackerOps, f.signerDenials, p.attackerOps, p.alertsDuringAttack);
            if (d.attackerOps.delegatecall !== "executed" || d.lossUsd !== 1460000000) process.exit(1);
            if (f.attackerOps.delegatecall !== "refused" || f.lossUsd !== 0 || !f.signerDenials["attacker:undecodable"]) process.exit(1);
            if (!(p.attackerOps.drips > 0) || p.alertsDuringAttack !== 0 || p.benign.blocked !== 0) process.exit(1)'
      - name: Install research-net smoke test
        working-directory: research-net
        run: npm ci
      - name: Smoke test against a local Hardhat Prague node
        run: |
          (cd testbed && npx hardhat node --port 8599 > /tmp/hh.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8599 && break; sleep 1; done
          cd research-net
          RPC=http://127.0.0.1:8599 CHAIN_ID=31337 SKIP_SYSTEM_CONTRACTS=1 \
          FUNDER_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          npm run smoke
      - name: Dashboard end-to-end test
        working-directory: dashboard
        run: node test.mjs
      - name: Dashboard retries start-up crashes and keeps every attempt (limitation E14)
        working-directory: dashboard
        run: node test-retry.mjs
      - name: Shell syntax
        run: bash -n research-net/setup.sh && bash -n infra/proxmox/provision-research-vm.sh
